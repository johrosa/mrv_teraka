; Configuration du plugin MRV Teraka, lue au démarrage de QGIS.
; Après modification, redémarrer QGIS pour appliquer les valeurs.
; Toutes les valeurs doivent être des entiers strictement positifs.

[migration]
; Nombre maximal d'entités envoyées dans une requête de migration.
; Les lots sont envoyés successivement, sans requêtes parallèles.
batch_size = 100
; Seuil de requêtes rejetées avec la même erreur avant de limiter le diagnostic.
repeated_error_limit = 10

[postgrest]
; Nombre d'enregistrements demandés par page lors des lectures API.
page_size = 5000
; Délais d'attente réseau, en secondes.
request_timeout = 30
connection_timeout = 5
auth_timeout = 15
; Intervalle entre les vérifications de connexion, en secondes.
connection_check_interval = 60
